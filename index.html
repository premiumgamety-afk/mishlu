<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kot4321.com</title>
<style>
  :root {
    --bg: #f3f1f8; --surface: #ffffff; --text: #1d1b2e; --muted: #6b6784;
    --accent: #5b4bdb; --line: #dedaf0;
    --online: #23a55a; --idle: #f0b232; --dnd: #f23f43; --offline: #80848e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16141f; --surface: #201d2e; --text: #ece9fa; --muted: #9a95b8;
      --accent: #9d8cff; --line: #332f4a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: grid; place-items: center; padding: 24px;
  }
  main {
    width: 100%; max-width: 420px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
  }
  .banner { height: 96px; background: var(--accent); }
  .head { padding: 0 24px; margin-top: -44px; }
  .avatar-wrap { position: relative; width: 88px; height: 88px; }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%;
    border: 5px solid var(--surface); background: var(--line);
    object-fit: cover; display: block;
  }
  .status {
    position: absolute; right: 2px; bottom: 2px; width: 22px; height: 22px;
    border-radius: 50%; border: 4px solid var(--surface); background: var(--offline);
  }
  .status.online { background: var(--online); }
  .status.idle { background: var(--idle); }
  .status.dnd { background: var(--dnd); }
  h1 { margin: 12px 0 0; font-size: 1.6rem; letter-spacing: .01em; }
  .tag { margin: 2px 0 0; color: var(--muted); }
  .body { padding: 16px 24px 24px; }
  .bio { line-height: 1.55; margin: 0 0 20px; max-width: 60ch; }
  .activity {
    margin: 0 0 20px; padding: 10px 12px; border-radius: 12px;
    background: var(--bg); color: var(--muted); font-size: .92rem;
  }
  dl { margin: 0 0 20px; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links a {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--text); text-decoration: none; font-size: .95rem;
  }
  .links a:hover, .links a:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
  button.copy {
    font: inherit; cursor: pointer; padding: 8px 14px; border-radius: 999px;
    border: 0; background: var(--accent); color: var(--surface);
  }
  button.copy:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="banner"></div>
  <div class="head">
    <div class="avatar-wrap">
      <img class="avatar" id="avatar" alt="Аватар kot4321.com" src="">
      <span class="status" id="status" title="offline"></span>
    </div>
    <h1 id="name">kot4321.com</h1>
    <p class="tag">Discord: kot4321.com</p>
  </div>
  <div class="body">
    <!-- ЗАМЕНИ текст ниже на свою информацию -->
    <p class="bio">Коротко о себе: чем занимаешься, что любишь, во что играешь.</p>
    <p class="activity" id="activity" hidden></p>
    <dl>
      <dt>Город</dt><dd>—</dd>
      <dt>Язык</dt><dd>Русский, English</dd>
      <dt>Интересы</dt><dd>игры, музыка, код</dd>
    </dl>
    <div class="links">
      <button class="copy" id="copy">Скопировать ник</button>
      <a href="#">GitHub</a>
      <a href="#">Steam</a>
      <a href="#">Telegram</a>
    </div>
  </div>
</main>

<script>
  // Заполни Discord ID (число) — нужен для живого статуса и аватара.
  // Включить: Настройки Discord → Расширенные → Режим разработчика → ПКМ по себе → Копировать ID.
  // Для живого статуса зайди на сервер Lanyard: discord.gg/lanyard
  const DISCORD_ID = "";
  const USERNAME = "kot4321.com";

  document.getElementById("copy").addEventListener("click", async (e) => {
    try {
      await navigator.clipboard.writeText(USERNAME);
      e.target.textContent = "Скопировано";
    } catch (err) {
      e.target.textContent = "Не удалось";
    }
    setTimeout(() => (e.target.textContent = "Скопировать ник"), 1500);
  });

  async function loadPresence() {
    if (!DISCORD_ID) return;
    try {
      const res = await fetch("https://api.lanyard.rest/v1/users/" + DISCORD_ID);
      const { success, data } = await res.json();
      if (!success) return;

      const u = data.discord_user;
      document.getElementById("name").textContent = u.global_name || u.username;
      if (u.avatar) {
        document.getElementById("avatar").src =
          `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=256`;
      }
      const st = document.getElementById("status");
      st.className = "status " + data.discord_status;
      st.title = data.discord_status;

      const act = data.activities.find((a) => a.type !== 4);
      const box = document.getElementById("activity");
      if (act) {
        box.textContent = (act.type === 2 ? "Слушает: " : "Сейчас: ") + act.name +
          (act.details ? " — " + act.details : "");
        box.hidden = false;
      } else {
        box.hidden = true;
      }
    } catch (err) {
      /* статус необязателен — страница работает и без него */
    }
  }
  loadPresence();
  setInterval(loadPresence, 30000);
</script>
</body>
</html>
